name: Build Telegram WEB Proxy Android POC

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      TELEGRAM_BASE: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c
      OLD_TELEGRAM_BASE: 4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439

    steps:
      - name: Checkout POC kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct reviewed POC sources
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py

          # Test the current reviewed POC against the new upstream commit without
          # rewriting the reviewed chunks yet. If compatibility is proven by CI,
          # the bundle itself can be repinned in a separate reviewed change.
          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ["OLD_TELEGRAM_BASE"]
          new = os.environ["TELEGRAM_BASE"]
          for name in ("apply_web_proxy_patch.py", "protocol_vectors_test.py"):
              p = Path(name)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{name}: expected pinned base {old} not found")
              p.write_text(text.replace(old, new))
              print(f"{name}: repinned {count} occurrence(s) to {new}")
          PY

          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Checkout pinned Telegram Android source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin "$TELEGRAM_BASE"
          git -C Telegram checkout --detach FETCH_HEAD
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "$TELEGRAM_BASE"

          # Upstream fixed the missing jlatexmath registration after 12.10.0.
          # Treat it as an upstream invariant now instead of modifying settings.gradle.
          grep -q "include ':jlatexmath'" Telegram/settings.gradle
          grep -q "project(':jlatexmath').projectDir" Telegram/settings.gradle
          test -f Telegram/TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

          # 12.10.1 moved the Android build to API 36 / CMake 3.22.1.
          grep -q "compileSdkVersion 36" Telegram/TMessagesProj/build.gradle
          grep -q "version '3.22.1'" Telegram/TMessagesProj/build.gradle

      - name: Verify patch compatibility
        shell: bash
        run: python3 apply_web_proxy_patch.py Telegram --dry-run

      - name: Apply WEB proxy Android POC
        shell: bash
        run: python3 apply_web_proxy_patch.py Telegram

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches of {old!r}, found {count}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          # The app module controls packaging.
          edit(
              "TMessagesProj_App/build.gradle",
              'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
              'abiFilters "arm64-v8a"',
              3,
          )

          # The library module owns the CMake tasks. Restrict it too or AGP still
          # builds every ABI and can exhaust the GitHub runner disk.
          edit(
              "TMessagesProj/build.gradle",
              "        multiDexEnabled true\n\n        externalNativeBuild {\n",
              "        multiDexEnabled true\n\n        ndk {\n"
              "            abiFilters \"arm64-v8a\"\n        }\n\n        externalNativeBuild {\n",
              1,
          )

          # Native debug symbol packaging costs gigabytes and is not useful here.
          edit("TMessagesProj/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 6)
          edit("TMessagesProj_App/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 3)
          PY
          grep -n "abiFilters" TMessagesProj/build.gradle TMessagesProj_App/build.gradle

      - name: Show patch summary
        shell: bash
        run: |
          git -C Telegram status --short
          git -C Telegram diff --stat

      - name: Compile patched Java first
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:compileAfatDebugJavaWithJavac

      - name: Build ARM64 debug APK
        working-directory: Telegram
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:assembleAfatDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -s Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          ls -lh Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          sha256sum Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk | tee app.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-android-12.10.1-arm64
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
            app.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload audit sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-patched-sources-12.10.1
          path: |
            apply_web_proxy_patch.py
            WebProxyTransport.java
            protocol_vectors_test.py
            Telegram/TMessagesProj/src/main/java/org/telegram/messenger/SharedConfig.java
            Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
            Telegram/TMessagesProj/src/main/java/org/telegram/messenger/NotificationsService.java
            Telegram/TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
            Telegram/TMessagesProj/src/main/java/org/telegram/ui/ProxySettingsActivity.java
            Telegram/TMessagesProj/src/main/java/org/telegram/ui/ProxyListActivity.java
            Telegram/TMessagesProj/src/main/AndroidManifest.xml
            Telegram/TMessagesProj/config/debug/AndroidManifest.xml
            Telegram/TMessagesProj/config/release/AndroidManifest.xml
          if-no-files-found: ignore
          retention-days: 7
