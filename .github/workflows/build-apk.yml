name: Build Telegram WEB Proxy Android POC

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout POC kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct reviewed POC sources
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py
          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2.4988404"

      - name: Checkout pinned Telegram Android source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin 4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439
          git -C Telegram checkout --detach FETCH_HEAD
          # 12.10.0 added TMessagesProj/lib/jlatexmath with an ssh remote. A CI runner
          # has no key for github.com, so rewrite ssh remotes to https for the clone.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439"
          # TMessagesProj/build.gradle depends on project(':jlatexmath'), but upstream
          # settings.gradle never registers it. The submodule keeps the library module
          # one level down, next to its own sample projects.
          test -f Telegram/TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle
          if ! grep -q "':jlatexmath'" Telegram/settings.gradle; then
            {
              echo ""
              echo "include ':jlatexmath'"
              echo "project(':jlatexmath').projectDir = new File(rootDir, 'TMessagesProj/lib/jlatexmath/jlatexmath')"
            } >> Telegram/settings.gradle
          fi
          cat Telegram/settings.gradle

      - name: Verify patch compatibility
        shell: bash
        run: python3 apply_web_proxy_patch.py Telegram --dry-run

      - name: Apply WEB proxy Android POC
        shell: bash
        run: python3 apply_web_proxy_patch.py Telegram

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches of {old!r}, found {count}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          # The app module only controls which ABIs get packaged.
          edit(
              "TMessagesProj_App/build.gradle",
              'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
              'abiFilters "arm64-v8a"',
              3,
          )

          # The library module owns the CMake tasks. Without abiFilters here AGP
          # still builds every supported ABI, which is what blew up the runner disk.
          edit(
              "TMessagesProj/build.gradle",
              "        multiDexEnabled true\n\n        externalNativeBuild {\n",
              "        multiDexEnabled true\n\n        ndk {\n"
              "            abiFilters \"arm64-v8a\"\n        }\n\n        externalNativeBuild {\n",
              1,
          )

          # Native debug symbol packaging costs gigabytes and is useless for this POC.
          edit("TMessagesProj/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 6)
          edit("TMessagesProj_App/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 3)
          PY
          grep -n "abiFilters" TMessagesProj/build.gradle TMessagesProj_App/build.gradle

      - name: Show patch summary
        shell: bash
        run: |
          git -C Telegram status --short
          git -C Telegram diff --stat

      - name: Compile patched Java first
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:compileAfatDebugJavaWithJavac

      - name: Build ARM64 debug APK
        working-directory: Telegram
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:assembleAfatDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -s Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          ls -lh Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          sha256sum Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk | tee app.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-android-poc-arm64
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
            app.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload patched sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-patched-sources
          path: |
            apply_web_proxy_patch.py
            WebProxyTransport.java
            protocol_vectors_test.py
            Telegram/TMessagesProj/src/main/java/org/telegram/messenger/SharedConfig.java
            Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
            Telegram/TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
            Telegram/TMessagesProj/src/main/java/org/telegram/ui/ProxySettingsActivity.java
          if-no-files-found: ignore
          retention-days: 3
