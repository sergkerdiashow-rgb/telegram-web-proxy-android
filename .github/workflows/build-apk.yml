name: Build final Telegram WEB Proxy 12.10.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BASE: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c
      OLD_TELEGRAM_BASE: 4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g

    steps:
      - name: Checkout WEB proxy kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct and test WEB proxy patch
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          old = os.environ['OLD_TELEGRAM_BASE']
          new = os.environ['TELEGRAM_BASE']
          for name in ('apply_web_proxy_patch.py', 'protocol_vectors_test.py'):
              p = Path(name)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
          PY
          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run WEB proxy transport self-test
        shell: bash
        run: |
          set -euxo pipefail
          python3 selftest/run.py

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Checkout pinned Telegram Android 12.10.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin "$TELEGRAM_BASE"
          git -C Telegram checkout --detach FETCH_HEAD
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "$TELEGRAM_BASE"
          grep -q "APP_VERSION_NAME=12.10.1" Telegram/gradle.properties
          grep -q "APP_VERSION_CODE=7038" Telegram/gradle.properties
          grep -q "compileSdkVersion 36" Telegram/TMessagesProj/build.gradle
          grep -q "version '3.22.1'" Telegram/TMessagesProj/build.gradle
          grep -q "include ':jlatexmath'" Telegram/settings.gradle
          test -s Telegram/TMessagesProj/config/release.keystore

      - name: Apply WEB proxy implementation
        shell: bash
        run: |
          set -euxo pipefail
          python3 apply_web_proxy_patch.py Telegram --dry-run
          python3 apply_web_proxy_patch.py Telegram

      - name: Inject our Telegram API from repository secret
        shell: bash
        env:
          RAW_API: ${{ secrets.API }}
          API_ID_DIRECT: ${{ secrets.TELEGRAM_API_ID || secrets.TG_API_ID || secrets.API_ID || secrets.APP_ID }}
          API_HASH_DIRECT: ${{ secrets.TELEGRAM_API_HASH || secrets.TG_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          raw = os.environ.get('RAW_API', '').strip()
          api_id = os.environ.get('API_ID_DIRECT', '').strip()
          api_hash = os.environ.get('API_HASH_DIRECT', '').strip()

          def good_id(v):
              return v.isdigit() and int(v) > 0 and int(v) != 4

          def good_hash(v):
              return re.fullmatch(r'[0-9a-fA-F]{32}', v or '') is not None

          def take_mapping(obj):
              if not isinstance(obj, dict):
                  return '', ''
              norm = {re.sub(r'[^a-z0-9]', '', str(k).lower()): str(v).strip() for k, v in obj.items()}
              ids = ('apiid', 'appid', 'telegramapiid', 'telegramappid', 'id')
              hashes = ('apihash', 'apphash', 'telegramapihash', 'telegramapphash', 'hash')
              i = next((norm[k] for k in ids if k in norm), '')
              h = next((norm[k] for k in hashes if k in norm), '')
              return i, h

          if not (good_id(api_id) and good_hash(api_hash)) and raw:
              try:
                  parsed_id, parsed_hash = take_mapping(json.loads(raw))
                  if parsed_id:
                      api_id = parsed_id
                  if parsed_hash:
                      api_hash = parsed_hash
              except Exception:
                  pass

          if not good_id(api_id) and raw:
              m = re.search(r'(?i)(?:api|app|telegram)[_\s-]*id\s*[:=]\s*["\']?(\d{2,12})', raw)
              if m:
                  api_id = m.group(1)

          if not good_hash(api_hash) and raw:
              m = re.search(r'(?i)(?:api|app|telegram)[_\s-]*hash\s*[:=]\s*["\']?([0-9a-f]{32})', raw)
              if m:
                  api_hash = m.group(1)

          if raw and not good_hash(api_hash):
              hashes = re.findall(r'(?i)(?<![0-9a-f])([0-9a-f]{32})(?![0-9a-f])', raw)
              if hashes:
                  api_hash = hashes[0]

          if raw and not good_id(api_id):
              scrubbed = raw
              if api_hash:
                  scrubbed = scrubbed.replace(api_hash, ' ')
              ids = re.findall(r'(?<!\d)(\d{2,12})(?!\d)', scrubbed)
              ids = [v for v in ids if good_id(v)]
              if ids:
                  api_id = ids[0]

          if not good_id(api_id):
              raise SystemExit('Secret API does not contain a valid private Telegram api_id')
          if not good_hash(api_hash):
              raise SystemExit('Secret API does not contain a valid 32-hex Telegram api_hash')

          path = Path('Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java')
          text = path.read_text()
          text, n1 = re.subn(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
          text, n2 = re.subn(r'public static String APP_HASH = "[0-9a-fA-F]+";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'BuildVars credential replacement failed: {n1}/{n2}')
          path.write_text(text)
          print('Private Telegram API credentials injected from secret API; values hidden.')
          PY
          ! grep -q 'public static int APP_ID = 4;' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          edit('TMessagesProj_App/build.gradle',
               'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
               'abiFilters "arm64-v8a"', 3)
          edit('TMessagesProj/build.gradle',
               '        multiDexEnabled true\n\n        externalNativeBuild {\n',
               '        multiDexEnabled true\n\n        ndk {\n            abiFilters "arm64-v8a"\n        }\n\n        externalNativeBuild {\n', 1)
          edit('TMessagesProj/build.gradle', "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 6)
          edit('TMessagesProj_App/build.gradle', "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 3)
          PY

      - name: Prepare standalone release variant
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('TMessagesProj/config/release/AndroidManifest_standalone.xml')
          text = manifest.read_text()
          for name in ['ic_launcher', 'icon_2_launcher', 'icon_3_launcher', 'icon_4_launcher', 'icon_5_launcher', 'icon_6_launcher']:
              old = f'@mipmap/{name}_sa'
              if old not in text:
                  raise SystemExit(f'expected {old}')
              text = text.replace(old, f'@mipmap/{name}')
          manifest.write_text(text)

          app = Path('TMessagesProj_App/build.gradle')
          text = app.read_text()
          marker = '        standalone {\n            debuggable false\n'
          if marker in text:
              text = text.replace(marker, "        standalone {\n            matchingFallbacks = ['release']\n            debuggable false\n", 1)
              app.write_text(text)
          PY

      - name: Confirm test signing identity
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          test -s TMessagesProj/config/release.keystore
          grep -q '^RELEASE_KEY_ALIAS=androidkey$' gradle.properties
          grep -q '^RELEASE_STORE_PASSWORD=android$' gradle.properties
          echo 'Using upstream Telegram test/demo signing key for this APK.'

      - name: Compile final Java
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:compileAfatStandaloneJavaWithJavac

      - name: Build final ARM64 standalone APK
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:assembleAfatStandalone

      - name: Verify final APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
          test -s "$APK"
          sha256sum "$APK" | tee app.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5 | tee apk-identity.txt
          grep -q "package: name='org.telegram.messenger.web'" apk-identity.txt
          grep -q "versionCode='70389'" apk-identity.txt
          grep -q "versionName='12.10.1'" apk-identity.txt
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | cut -d/ -f2 | sort -u | tee apk-abis.txt
          grep -qx 'arm64-v8a' apk-abis.txt
          test "$(wc -l < apk-abis.txt)" -eq 1

      - name: Upload final test-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-12.10.1-final-arm64-test-signed
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
            app.apk.sha256
            signing-certificate.txt
            apk-identity.txt
            apk-abis.txt
          if-no-files-found: error
          retention-days: 7
