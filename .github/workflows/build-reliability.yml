name: Build WEB Proxy reliability APK

on:
  workflow_dispatch:
  push:
    branches: [ diagnose-webproxy ]
    paths:
      - 'reliability/**'
      - '.github/workflows/build-reliability.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BASE: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g

    steps:
      - name: Checkout reliability branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct reviewed WEB proxy patch
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py
          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py reliability/apply_reliability_patch.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate permanent signing identity early
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          expected = '7d91476305e39a1d1ed8f5a6c63c93f40bea3ea49afb1e9115343a39cce28920'
          raw = os.environ['KEYSTORE_B64'].strip()
          store_password = os.environ['STORE_PASSWORD']
          key_alias = os.environ['KEY_ALIAS']
          key_password = os.environ['KEY_PASSWORD']
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          target = runner_temp / 'release.keystore'

          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ('"', "'"):
              raw = raw[1:-1].strip()
          if raw.lower().startswith('data:') and ',' in raw:
              raw = raw.split(',', 1)[1]

          def decode_b64(text):
              compact = re.sub(r'\s+', '', text)
              return base64.b64decode(compact, validate=True)

          candidates = []
          try:
              first = decode_b64(raw)
              candidates.append(('base64', first))
          except Exception:
              raise SystemExit('SIGNING_KEYSTORE_BASE64 is not valid base64 text')

          try:
              first_text = first.decode('ascii').strip()
          except UnicodeDecodeError:
              first_text = ''

          if first_text:
              try:
                  second = decode_b64(first_text)
                  if second and second != first:
                      candidates.append(('double-base64', second))
              except Exception:
                  pass
              compact_hex = re.sub(r'\s+', '', first_text)
              if len(compact_hex) % 2 == 0 and re.fullmatch(r'[0-9a-fA-F]+', compact_hex or ''):
                  try:
                      decoded_hex = bytes.fromhex(compact_hex)
                      if decoded_hex and all(decoded_hex != data for _, data in candidates):
                          candidates.append(('base64-then-hex', decoded_hex))
                  except ValueError:
                      pass

          failures = []
          accepted = None
          for label, data in candidates:
              candidate = runner_temp / f'release.{label}.keystore'
              candidate.write_bytes(data)

              listed = subprocess.run(
                  ['keytool', '-list', '-keystore', str(candidate), '-storepass', store_password, '-alias', key_alias],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if listed.returncode != 0:
                  failures.append(f'{label}: keytool rejected keystore/alias/store password')
                  continue

              with tempfile.TemporaryDirectory() as tmp:
                  probe_dir = Path(tmp)
                  (probe_dir / 'probe.txt').write_text('telegram-web-proxy signing probe\n')
                  probe_jar = probe_dir / 'probe.jar'
                  made = subprocess.run(
                      ['jar', 'cf', str(probe_jar), '-C', str(probe_dir), 'probe.txt'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if made.returncode != 0:
                      raise SystemExit('Unable to create signing probe jar')
                  signed = subprocess.run(
                      ['jarsigner', '-keystore', str(candidate), '-storepass', store_password,
                       '-keypass', key_password, str(probe_jar), key_alias],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if signed.returncode != 0:
                      failures.append(f'{label}: alias exists but private key/key password is unusable')
                      continue

              cert = runner_temp / f'certificate.{label}.der'
              exported = subprocess.run(
                  ['keytool', '-exportcert', '-alias', key_alias, '-keystore', str(candidate),
                   '-storepass', store_password, '-file', str(cert)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if exported.returncode != 0 or not cert.exists():
                  failures.append(f'{label}: certificate export failed')
                  continue
              fingerprint = hashlib.sha256(cert.read_bytes()).hexdigest()
              if fingerprint.lower() != expected:
                  failures.append(f'{label}: certificate SHA-256 mismatch ({fingerprint.lower()})')
                  continue

              target.write_bytes(data)
              accepted = label
              break

          for _, data in candidates:
              data = b''

          if accepted is None:
              print('Signing keystore validation failed safely. Candidate results:')
              for item in failures:
                  print(' - ' + item)
              raise SystemExit('No decoded signing candidate matches the required permanent private key')

          os.chmod(target, 0o600)
          print(f'Permanent signing identity validated ({accepted}); expected certificate SHA-256 matches.')
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Checkout Telegram Android 12.10.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin "$TELEGRAM_BASE"
          git -C Telegram checkout --detach FETCH_HEAD
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "$TELEGRAM_BASE"
          grep -q "APP_VERSION_NAME=12.10.1" Telegram/gradle.properties
          grep -q "APP_VERSION_CODE=7038" Telegram/gradle.properties

      - name: Apply base WEB proxy implementation
        shell: bash
        run: |
          set -euxo pipefail
          python3 apply_web_proxy_patch.py Telegram --dry-run
          python3 apply_web_proxy_patch.py Telegram

      - name: Apply full reliability transport
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode reliability/WebProxyTransport.java.gz.b64 | gzip --decompress > Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
          python3 reliability/apply_reliability_patch.py Telegram
          grep -q 'carrierEpoch' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
          grep -q 'registerDefaultNetworkCallback' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
          grep -q 'onRenderProcessUnresponsive' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
          grep -q 'SESSION_READY_TIMEOUT_MS = 105_000L' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/WebProxyTransport.java
          grep -q 'ApplicationLoader.startPushService();' Telegram/TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
          grep -q 'startForegroundService(serviceIntent)' Telegram/TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java

      - name: Inject private Telegram API credentials
        shell: bash
        env:
          RAW_API: ${{ secrets.API }}
          API_ID_DIRECT: ${{ secrets.TELEGRAM_API_ID || secrets.TG_API_ID || secrets.API_ID || secrets.APP_ID }}
          API_HASH_DIRECT: ${{ secrets.TELEGRAM_API_HASH || secrets.TG_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ.get('RAW_API', '').strip()
          api_id = os.environ.get('API_ID_DIRECT', '').strip()
          api_hash = os.environ.get('API_HASH_DIRECT', '').strip()
          good_id = lambda v: v.isdigit() and int(v) > 0 and int(v) != 4
          good_hash = lambda v: re.fullmatch(r'[0-9a-fA-F]{32}', v or '') is not None
          if raw and not (good_id(api_id) and good_hash(api_hash)):
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      norm = {re.sub(r'[^a-z0-9]', '', str(k).lower()): str(v).strip() for k,v in obj.items()}
                      for k in ('apiid','appid','telegramapiid','telegramappid','id'):
                          if k in norm and good_id(norm[k]): api_id = norm[k]; break
                      for k in ('apihash','apphash','telegramapihash','telegramapphash','hash'):
                          if k in norm and good_hash(norm[k]): api_hash = norm[k]; break
              except Exception:
                  pass
          if raw and not good_id(api_id):
              m = re.search(r'(?i)(?:api|app|telegram)[_\s-]*id\s*[:=]\s*["\']?(\d{2,12})', raw)
              if m: api_id = m.group(1)
          if raw and not good_hash(api_hash):
              m = re.search(r'(?i)(?:api|app|telegram)[_\s-]*hash\s*[:=]\s*["\']?([0-9a-f]{32})', raw)
              if m: api_hash = m.group(1)
          if not good_id(api_id): raise SystemExit('Private Telegram api_id not found')
          if not good_hash(api_hash): raise SystemExit('Private Telegram api_hash not found')
          path = Path('Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java')
          text = path.read_text()
          text,n1 = re.subn(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
          text,n2 = re.subn(r'public static String APP_HASH = "[0-9a-fA-F]+";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('BuildVars credential replacement failed')
          path.write_text(text)
          print('Private Telegram credentials injected; values hidden.')
          PY

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new, expected):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected}, got {count}')
              p.write_text(text.replace(old,new))
          edit('TMessagesProj_App/build.gradle','abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"','abiFilters "arm64-v8a"',3)
          edit('TMessagesProj/build.gradle','        multiDexEnabled true\n\n        externalNativeBuild {\n','        multiDexEnabled true\n\n        ndk {\n            abiFilters "arm64-v8a"\n        }\n\n        externalNativeBuild {\n',1)
          edit('TMessagesProj/build.gradle',"ndk.debugSymbolLevel = 'FULL'","ndk.debugSymbolLevel = 'NONE'",6)
          edit('TMessagesProj_App/build.gradle',"ndk.debugSymbolLevel = 'FULL'","ndk.debugSymbolLevel = 'NONE'",3)
          PY

      - name: Prepare standalone variant
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('TMessagesProj/config/release/AndroidManifest_standalone.xml')
          text=manifest.read_text()
          for name in ['ic_launcher','icon_2_launcher','icon_3_launcher','icon_4_launcher','icon_5_launcher','icon_6_launcher']:
              old=f'@mipmap/{name}_sa'
              if old not in text: raise SystemExit(f'missing {old}')
              text=text.replace(old,f'@mipmap/{name}')
          manifest.write_text(text)
          app=Path('TMessagesProj_App/build.gradle'); text=app.read_text()
          marker='        standalone {\n            debuggable false\n'
          if marker not in text: raise SystemExit('standalone marker not found')
          app.write_text(text.replace(marker,"        standalone {\n            matchingFallbacks = ['release']\n            debuggable false\n",1))
          PY

      - name: Compile patched Java first
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:compileAfatStandaloneJavaWithJavac

      - name: Install validated permanent signing identity
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/release.keystore"
          mkdir -p ~/.gradle
          cp "$RUNNER_TEMP/release.keystore" Telegram/TMessagesProj/config/release.keystore
          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties Telegram/TMessagesProj/config/release.keystore

      - name: Build signed reliability APK
        working-directory: Telegram
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=4 :TMessagesProj_App:assembleAfatStandalone 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 400 ../gradle-build.log > ../gradle-failure-tail.txt
            grep -E 'FAILURE:|What went wrong:|Execution failed for task|error:|CMake Error|ninja:|Caused by:' ../gradle-build.log | tail -n 120 > ../gradle-failure-keylines.txt || true
            {
              echo '### Gradle failure key lines'
              echo '```text'
              cat ../gradle-failure-keylines.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              printf '::error::%s\n' "$safe"
            done < ../gradle-failure-keylines.txt
          fi
          exit "$status"

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-failure-tail.txt
            gradle-failure-keylines.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
          test -s "$APK"
          sha256sum "$APK" | tee app.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          grep -qi '7d91476305e39a1d1ed8f5a6c63c93f40bea3ea49afb1e9115343a39cce28920' signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5 | tee apk-identity.txt
          grep -q "package: name='org.telegram.messenger.web'" apk-identity.txt
          grep -q "versionCode='70389'" apk-identity.txt
          grep -q "versionName='12.10.1'" apk-identity.txt
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | cut -d/ -f2 | sort -u | tee apk-abis.txt
          grep -qx 'arm64-v8a' apk-abis.txt
          test "$(wc -l < apk-abis.txt)" -eq 1

      - name: Upload reliability APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-12.10.1-reliability-arm64
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
            app.apk.sha256
            signing-certificate.txt
            apk-identity.txt
            apk-abis.txt
          if-no-files-found: error
          retention-days: 7
