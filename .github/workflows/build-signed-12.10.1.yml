name: Build signed WEB Proxy APK 12.10.1

on:
  workflow_dispatch:
  push:
    branches: [ upgrade/telegram-12.10.1 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BASE: 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g

    steps:
      - name: Checkout WEB proxy kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct reviewed WEB proxy sources
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py
          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Checkout pinned Telegram Android 12.10.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin "$TELEGRAM_BASE"
          git -C Telegram checkout --detach FETCH_HEAD
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "$TELEGRAM_BASE"
          grep -q "compileSdkVersion 36" Telegram/TMessagesProj/build.gradle
          grep -q "version '3.22.1'" Telegram/TMessagesProj/build.gradle
          grep -q "include ':jlatexmath'" Telegram/settings.gradle
          grep -q "APP_VERSION_NAME=12.10.1" Telegram/gradle.properties
          grep -q "APP_VERSION_CODE=7038" Telegram/gradle.properties

      - name: Apply WEB proxy implementation
        shell: bash
        run: |
          set -euxo pipefail
          python3 apply_web_proxy_patch.py Telegram --dry-run
          python3 apply_web_proxy_patch.py Telegram

      - name: Inject private Telegram API credentials only
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.API_ID || secrets.APP_ID || secrets.TELEGRAM_APP_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.API_HASH || secrets.APP_HASH || secrets.TELEGRAM_APP_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

          if not api_id.isdigit() or int(api_id) <= 0:
              raise SystemExit("Private Telegram API ID secret is missing or invalid")
          if int(api_id) == 4:
              raise SystemExit("Refusing to build with Telegram public sample APP_ID=4")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              raise SystemExit("Private Telegram API hash secret is missing or invalid")

          path = Path("Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          text = path.read_text()
          text, n1 = re.subn(r"public static int APP_ID = \d+;", f"public static int APP_ID = {api_id};", text, count=1)
          text, n2 = re.subn(r'public static String APP_HASH = "[0-9a-fA-F]+";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"BuildVars credential replacement failed: APP_ID={n1}, APP_HASH={n2}")
          path.write_text(text)
          print("Private Telegram API credentials injected; values intentionally not logged.")
          PY
          ! grep -q "public static int APP_ID = 4;" Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          edit(
              "TMessagesProj_App/build.gradle",
              'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
              'abiFilters "arm64-v8a"',
              3,
          )
          edit(
              "TMessagesProj/build.gradle",
              "        multiDexEnabled true\n\n        externalNativeBuild {\n",
              "        multiDexEnabled true\n\n        ndk {\n            abiFilters \"arm64-v8a\"\n        }\n\n        externalNativeBuild {\n",
              1,
          )
          edit("TMessagesProj/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 6)
          edit("TMessagesProj_App/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 3)
          PY

      - name: Prepare standalone variant
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("TMessagesProj/config/release/AndroidManifest_standalone.xml")
          text = manifest.read_text()
          for name in ["ic_launcher", "icon_2_launcher", "icon_3_launcher", "icon_4_launcher", "icon_5_launcher", "icon_6_launcher"]:
              old = f"@mipmap/{name}_sa"
              if old not in text:
                  raise SystemExit(f"expected {old} in standalone manifest")
              text = text.replace(old, f"@mipmap/{name}")
          manifest.write_text(text)

          app = Path("TMessagesProj_App/build.gradle")
          text = app.read_text()
          marker = "        standalone {\n            debuggable false\n"
          if marker not in text:
              raise SystemExit("standalone build type marker not found")
          text = text.replace(marker,
              "        standalone {\n            matchingFallbacks = ['release']\n            debuggable false\n", 1)
          app.write_text(text)
          PY

      - name: Install required signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are incomplete. Refusing to build an APK with another key." >&2
            exit 1
          fi
          mkdir -p ~/.gradle
          printf '%s' "$KEYSTORE_B64" | base64 --decode > Telegram/TMessagesProj/config/release.keystore
          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties Telegram/TMessagesProj/config/release.keystore
          echo "Required signing identity installed; no demo-key fallback is allowed."

      - name: Build signed ARM64 standalone APK
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:assembleAfatStandalone

      - name: Verify APK identity, ABI and signing certificate
        shell: bash
        run: |
          set -euxo pipefail
          APK=Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
          test -s "$APK"
          sha256sum "$APK" | tee app.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5 | tee apk-identity.txt
          grep -q "versionName='12.10.1'" apk-identity.txt
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | cut -d/ -f2 | sort -u | tee apk-abis.txt
          grep -qx 'arm64-v8a' apk-abis.txt
          test "$(wc -l < apk-abis.txt)" -eq 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-12.10.1-arm64-signed-private-api
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
            app.apk.sha256
            signing-certificate.txt
            apk-identity.txt
            apk-abis.txt
          if-no-files-found: error
          retention-days: 7
