name: Build signed standalone APK

# Distributable build: non-debuggable, minified, signed with your own key.
# Add these repository secrets to sign with your key:
#   SIGNING_KEYSTORE_BASE64   base64 of your .jks / .keystore file
#   SIGNING_KEYSTORE_PASSWORD store password
#   SIGNING_KEY_ALIAS         key alias
#   SIGNING_KEY_PASSWORD      key password
# Without them the build falls back to DrKLO's public demo keystore and the
# artifact is named accordingly - that APK must not be handed to anyone.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout POC kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Reconstruct reviewed POC sources
        shell: bash
        run: |
          set -euxo pipefail
          cat chunks/*.txt | base64 --decode | gzip --decompress > ci_bundle.py
          python3 ci_bundle.py
          python3 -m py_compile apply_web_proxy_patch.py protocol_vectors_test.py
          python3 protocol_vectors_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2.4988404"

      - name: Checkout pinned Telegram Android source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Telegram
          git -C Telegram init
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth=1 origin 4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439
          git -C Telegram checkout --detach FETCH_HEAD
          # 12.10.0 added TMessagesProj/lib/jlatexmath with an ssh remote. A CI runner
          # has no key for github.com, so rewrite ssh remotes to https for the clone.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C Telegram submodule update --init --recursive --depth=1
          test "$(git -C Telegram rev-parse HEAD)" = "4e1a61eca6c9b6ee3aa9c35cf8c70554750f2439"

      - name: Apply WEB proxy Android POC
        shell: bash
        run: |
          set -euxo pipefail
          python3 apply_web_proxy_patch.py Telegram --dry-run
          python3 apply_web_proxy_patch.py Telegram

      - name: Restrict native build to ARM64
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches of {old!r}, found {count}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          edit(
              "TMessagesProj_App/build.gradle",
              'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"',
              'abiFilters "arm64-v8a"',
              3,
          )
          edit(
              "TMessagesProj/build.gradle",
              "        multiDexEnabled true\n\n        externalNativeBuild {\n",
              "        multiDexEnabled true\n\n        ndk {\n"
              "            abiFilters \"arm64-v8a\"\n        }\n\n        externalNativeBuild {\n",
              1,
          )
          edit("TMessagesProj/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 6)
          edit("TMessagesProj_App/build.gradle", "ndk.debugSymbolLevel = 'FULL'", "ndk.debugSymbolLevel = 'NONE'", 3)
          PY

      - name: Remap standalone launcher icons
        working-directory: Telegram
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The standalone manifest points at *_sa launcher icons. Telegram keeps those
          # adaptive-icon XMLs out of the open source tree, so aapt cannot link them.
          # Remap each one onto the published icon of the same name.
          path = Path("TMessagesProj/config/release/AndroidManifest_standalone.xml")
          text = path.read_text()
          names = ["ic_launcher", "icon_2_launcher", "icon_3_launcher",
                   "icon_4_launcher", "icon_5_launcher", "icon_6_launcher"]
          total = 0
          for name in names:
              old = f"@mipmap/{name}_sa"
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected {old} in the standalone manifest")
              text = text.replace(old, f"@mipmap/{name}")
              total += count
          path.write_text(text)
          print(f"remapped {total} launcher icon reference(s)")
          PY
          ! grep -q "_sa" TMessagesProj/config/release/AndroidManifest_standalone.xml

      - name: Install signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "SIGNING_KEYSTORE_BASE64 is set but one of the other three signing secrets is missing." >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 --decode > Telegram/TMessagesProj/config/release.keystore
            # Gradle reads GRADLE_USER_HOME/gradle.properties with higher precedence than
            # the project file, so the values never appear on a command line.
            {
              printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
              printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            } > ~/.gradle/gradle.properties
            echo "own_key=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the keystore from repository secrets."
          else
            echo "own_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. Falling back to DrKLO's public demo keystore - do not distribute this APK."
          fi

      - name: Build ARM64 standalone APK
        working-directory: Telegram
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=4 :TMessagesProj_App:assembleAfatStandalone

      - name: Verify APK and print signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app.apk.sha256
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | cut -d/ -f2 | sort -u

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-web-proxy-arm64-standalone-${{ steps.signing.outputs.own_key == 'true' && 'signed' || 'DEMOKEY-DO-NOT-DISTRIBUTE' }}
          path: |
            Telegram/TMessagesProj_App/build/outputs/apk/afat/standalone/app.apk
            app.apk.sha256
          if-no-files-found: error
          retention-days: 7
